[package]
name = "inspection"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
organization-registry = { path = "../organization-registry" }
shipment = { path = "../shipment" }
shipment-factory = { path = "../shipment-factory" }
handoff-proof = { path = "../handoff-proof" }
